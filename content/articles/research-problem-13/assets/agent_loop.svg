<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560"><rect width="1400" height="560" fill="#0b1220"/><text x="48" y="68" font-family="Arial" font-size="38" font-weight="bold" fill="white">AI-assisted GPU optimization: evidence before deployment</text><rect x="45" y="132" width="310" height="95" rx="18" fill="#27446d"/><text x="63" y="187" font-family="Arial" font-size="24" fill="white">Profile baseline</text><rect x="390" y="132" width="310" height="95" rx="18" fill="#0f7772"/><text x="408" y="187" font-family="Arial" font-size="24" fill="white">Generate candidate</text><rect x="735" y="132" width="310" height="95" rx="18" fill="#27446d"/><text x="753" y="187" font-family="Arial" font-size="24" fill="white">Correctness tests</text><rect x="1080" y="132" width="270" height="95" rx="18" fill="#27446d"/><text x="1098" y="187" font-family="Arial" font-size="24" fill="white">Benchmarks</text><rect x="390" y="324" width="310" height="95" rx="18" fill="#8c3c48"/><text x="408" y="379" font-family="Arial" font-size="24" fill="white">Reject / revise</text><rect x="735" y="324" width="310" height="95" rx="18" fill="#0f7772"/><text x="753" y="379" font-family="Arial" font-size="24" fill="white">Independent review</text><rect x="1080" y="324" width="270" height="95" rx="18" fill="#27446d"/><text x="1098" y="379" font-family="Arial" font-size="24" fill="white">Canary + rollback</text><path d="M355 180 h35" stroke="#fbbf52" stroke-width="6" fill="none"/><path d="M700 180 h35" stroke="#fbbf52" stroke-width="6" fill="none"/><path d="M1045 180 h35" stroke="#fbbf52" stroke-width="6" fill="none"/><path d="M1045 372 h35" stroke="#fbbf52" stroke-width="6" fill="none"/><path d="M870 230 V324" stroke="#fbbf52" stroke-width="5"/><path d="M560 324 V276 H870" stroke="#ff7785" stroke-width="5" fill="none"/><text x="55" y="496" font-family="Arial" font-size="24" fill="#d1e2f5">A fast candidate is not an accepted candidate until it passes numerical and scientific gates.</text></svg>