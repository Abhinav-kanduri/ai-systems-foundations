<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="580" viewBox="0 0 1400 580"><rect width="1400" height="580" fill="#0b1220"/><text x="52" y="68" font-family="Arial" font-size="38" font-weight="bold" fill="#ffffff">Kernel fusion: why moving bytes matters</text><text x="72" y="133" font-family="Arial" font-size="26" fill="#ffb84a">SEPARATE: 3 launches + intermediate global-memory transfers</text><text x="752" y="133" font-family="Arial" font-size="26" fill="#4dd2c0">FUSED: 1 launch + fewer intermediate transfers</text><rect x="65" y="168" width="530" height="65" rx="14" fill="#284165"/><text x="87" y="210" font-family="Arial" font-size="25" fill="white">Read input tensor</text><rect x="65" y="243" width="530" height="65" rx="14" fill="#4d385e"/><text x="87" y="285" font-family="Arial" font-size="25" fill="white">Multiply → write/read intermediate</text><rect x="65" y="318" width="530" height="65" rx="14" fill="#4d385e"/><text x="87" y="360" font-family="Arial" font-size="25" fill="white">Add bias → write/read intermediate</text><rect x="65" y="393" width="530" height="65" rx="14" fill="#284165"/><text x="87" y="435" font-family="Arial" font-size="25" fill="white">Activation → write output</text><rect x="745" y="168" width="530" height="65" rx="14" fill="#284165"/><text x="767" y="210" font-family="Arial" font-size="25" fill="white">Read input tensor</text><rect x="745" y="243" width="530" height="65" rx="14" fill="#0b716e"/><text x="767" y="285" font-family="Arial" font-size="25" fill="white">Multiply + bias + activation</text><rect x="745" y="318" width="530" height="65" rx="14" fill="#284165"/><text x="767" y="360" font-family="Arial" font-size="25" fill="white">Write final output</text><text x="745" y="430" font-family="Arial" font-size="25" fill="#c6d6ec">But fusion may increase register pressure.</text><text x="65" y="525" font-family="Arial" font-size="23" fill="#c6d6ec">Illustrative architecture—not a measured speedup or guaranteed compiler behavior.</text></svg>